{% extends "base.html" %}
{% block content %}
<section class="card">
    <h2>900 Code List</h2>
    <table class="data-table">
        <thead><tr><th>900-NXX</th><th>Entity</th><th>OCC</th></tr></thead>
        <tbody>
        {% for row in rows %}
            <tr>
                <td>900-{{ row[0] }}</td>
                <td>{{ row[1] if row|length > 1 else '' }}</td>
                <td>{{ row[2] if row|length > 2 else '' }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
