{% extends "base.html" %}
{% block content %}
<section class="card">
    <h2>N11 Code List</h2>
    <table class="data-table">
        <thead><tr><th>N11</th><th>Description</th></tr></thead>
        <tbody>
        {% for row in rows %}
            <tr><td>{{ row[0] }}</td><td>{{ row[1] if row|length > 1 else '' }}</td></tr>
        {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
