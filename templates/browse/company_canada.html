{% extends "base.html" %}
{% block content %}
<section class="card" id="company-codes">
    <h2>{{ company_name }} (OCN {{ ocn }})</h2>
    {% if rows %}
        <table class="data-table data-table--sortable">
            <thead>
                <tr>
                    <th scope="col">
                        <a
                            class="data-table-sort{% if sort == 'npanxx' %} data-table-sort--active{% endif %}"
                            href="{{ url_for('browse.company_detail', ocn=ocn, companyname=company_name, state=state, country='CANADA', sort='npanxx') }}#company-codes"
                        >NPA</a>
                    </th>
                    <th scope="col">NXX</th>
                    <th scope="col">
                        <a
                            class="data-table-sort{% if sort == 'exchange' %} data-table-sort--active{% endif %}"
                            href="{{ url_for('browse.company_detail', ocn=ocn, companyname=company_name, state=state, country='CANADA', sort='exchange') }}#company-codes"
                        >Exchange area</a>
                    </th>
                </tr>
            </thead>
            <tbody>
            {% for row in rows %}
                <tr>
                    <td>{{ row.NPA }}</td>
                    <td><a href="{{ url_for('lookup.office_codes', **{'npa-nxx': row.NPA ~ '-' ~ row.COCodeNXX}) }}">{{ row.COCodeNXX }}</a></td>
                    <td>{{ row.ExchangeArea }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No office codes found for this OCN.</p>
    {% endif %}
</section>
{% endblock %}
