{% extends "base.html" %}
{% block content %}
<section class="card" id="company-codes">
    <h2>{{ company_name }} (OCN {{ ocn }}) — {{ state }}</h2>
    {% if rows %}
        <table class="data-table data-table--sortable">
            <thead>
                <tr>
                    <th scope="col">
                        <a
                            class="data-table-sort{% if sort == 'npanxx' %} data-table-sort--active{% endif %}"
                            href="{{ url_for('browse.company_detail', ocn=ocn, companyname=company_name, state=state, country='US', sort='npanxx') }}#company-codes"
                        >NPANXX</a>
                    </th>
                    <th scope="col">
                        <a
                            class="data-table-sort{% if sort == 'exchange' %} data-table-sort--active{% endif %}"
                            href="{{ url_for('browse.company_detail', ocn=ocn, companyname=company_name, state=state, country='US', sort='exchange') }}#company-codes"
                        >Rate center</a>
                    </th>
                </tr>
            </thead>
            <tbody>
            {% for row in rows %}
                <tr>
                    <td><a href="{{ url_for('lookup.office_codes', **{'npa-nxx': row.NPANXX}) }}">{{ row.NPANXX }}</a></td>
                    <td>{{ row.RateCenter }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No office codes found for this OCN.</p>
    {% endif %}
</section>
{% endblock %}
