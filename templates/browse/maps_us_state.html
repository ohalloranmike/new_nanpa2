{% extends "base.html" %}
{% block content %}
<section class="card">
    <h2>{{ title }} ({{ state_code }})</h2>
    <div class="pill-list">
        {% for npa in npas %}
            <a href="{{ url_for('lookup.area_codes', npa=npa) }}">{{ npa }}</a>
        {% endfor %}
    </div>
</section>
{% if map_images %}
<section class="card maps">
    {% for map_path in map_images %}
        <img src="{{ url_for('static', filename=map_path) }}" alt="Map {{ state_code }}">
    {% endfor %}
</section>
{% endif %}
{% endblock %}
