{% extends "base.html" %}
{% block content %}
<section class="card">
    <h2>Canada Exchange Areas</h2>
    <p>
        <a href="{{ url_for('ocn.canada_exchange_all', sort='npa') }}">Sort by exchange / NPA</a> |
        <a href="{{ url_for('ocn.canada_exchange_all', sort='company') }}">Sort by company</a>
    </p>
    <table class="data-table">
        <thead>
            <tr>
                {% for header in headers %}
                    <th>{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
        {% for row in rows %}
            <tr>
                {% for value in row %}
                    <td>{{ value }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
