{% extends "base.html" %}
{% block content %}
<section class="card">
    <h2>Canada Operating Companies</h2>
    <p>
        <a href="{{ url_for('ocn.canada_ocn_all', sort='company') }}">Sort by company</a> |
        <a href="{{ url_for('ocn.canada_ocn_all', sort='ocn') }}">Sort by OCN</a>
    </p>
    <table class="data-table">
        <thead>
            <tr>
                <th>OCN</th>
                <th>Company</th>
                <th>Province</th>
            </tr>
        </thead>
        <tbody>
        {% for row in rows %}
            <tr>
                <td>{{ row["OCN"] }}</td>
                <td>
                    <a href="{{ url_for('browse.company_detail', ocn=row['OCN'], companyname=row['Company'], state=row['Province'], country='CANADA') }}">
                        {{ row["Company"] }}
                    </a>
                </td>
                <td>{{ row["Province"] }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
