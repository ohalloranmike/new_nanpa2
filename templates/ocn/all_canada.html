{% extends "base.html" %}
{% block content %}
<section class="card">
    <h2>Canada Operating Companies</h2>
    <p>
        <a href="{{ url_for('ocn.canada_ocn_all', sort='company') }}">Sort by company</a> |
        <a href="{{ url_for('ocn.canada_ocn_all', sort='ocn') }}">Sort by OCN</a>
    </p>
    <table class="data-table">
        <thead>
            <tr>
                {% for header in headers %}
                    <th>{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
        {% for row in rows %}
            <tr>
                {% for header in headers %}
                    <td>{{ row[header] }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
